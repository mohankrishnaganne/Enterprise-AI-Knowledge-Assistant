name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt chains runtime -> local embeddings -> test tooling.
        # The embeddings file carries the CPU-torch extra index; the default PyPI wheel
        # bundles CUDA and is ~2.5GB, which is slow and pointless in CI.
        run: pip install -r requirements-dev.txt

      - name: Generate the corpus
        # The two sample PDFs are gitignored build artifacts, so the tests covering the
        # PDF ingestion path need them rebuilt here.
        run: python scripts/generate_corpus.py

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        # Unit tests mock the LLM and vector store, so no API keys are needed.
        run: pytest

  shell-scripts:
    name: Shell script sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject CRLF line endings in shell scripts
        # A CRLF start.sh makes the container's shebang request an interpreter whose name
        # ends in a carriage return, and it dies with a message that says nothing about
        # line endings. This repo is developed on Windows, so the guard is worth having.
        run: |
          if grep -rlU $'\r' --include='*.sh' .; then
            echo "::error::the shell scripts above contain CRLF line endings; see .gitattributes"
            exit 1
          fi
          echo "all shell scripts are LF-only"

      - name: Shellcheck
        # The official static binary, pinned. Neither of the obvious alternatives works
        # reliably: shellcheck is not present on the runner image (the step failed in one
        # second with command-not-found), and installing it with apt adds a transient
        # network dependency that failed the job for reasons unrelated to the scripts.
        # Pinning also guarantees CI and local development see the same findings.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"             | tar -xJf -
          SHELLCHECK="./shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$SHELLCHECK" --version
          "$SHELLCHECK" docker/start.sh deploy/deploy_hf_space.sh

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: acme-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports its missing configuration
        # Without credentials the container must fail fast with a clear message rather
        # than starting and erroring on every request. That behaviour is worth asserting:
        # it is the difference between a five-second diagnosis and a long one.
        run: |
          output=$(docker run --rm acme-assistant:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "GROQ_API_KEY" \
            || { echo "::error::container did not report the missing API key clearly"; exit 1; }

      - name: Image contains the baked model and corpus
        run: |
          docker run --rm acme-assistant:ci python -c "
          import glob, os
          from pathlib import Path
          cache = Path(os.environ['HF_HOME'])
          assert any('bge-small' in str(p) for p in cache.rglob('*')), 'embedding model not baked in'
          assert len(glob.glob('data/raw/*/*.md')) >= 15, 'markdown corpus missing'
          assert len(glob.glob('data/raw/*/*.pdf')) == 2, 'corpus PDFs not regenerated'
          assert Path('data/eval/golden_dataset.json').exists(), 'golden dataset missing'
          print('image contents verified')
          "

  cloud-requirements:
    name: Streamlit Cloud runtime resolves without torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Resolve requirements.txt the way Streamlit Cloud does
        # Cloud installs this file with uv on Python 3.14. Two failures have already
        # been caused by getting this wrong: torch publishes no 3.14 wheels for the
        # pinned version, and `--extra-index-url` makes uv unable to resolve anything
        # the PyTorch index mirrors, because it only considers the first index that
        # publishes a package name.
        run: uv pip compile requirements.txt --python-version 3.14 --python-platform linux -o resolved.txt

      - name: Assert the runtime carries no local-embedding stack
        run: |
          if grep -qiE '^(torch|sentence-transformers|nvidia-)' resolved.txt; then
            echo "::error::requirements.txt pulled torch; it must stay deployable on a free tier"
            grep -iE '^(torch|sentence-transformers|nvidia-)' resolved.txt
            exit 1
          fi
          echo "runtime resolves to $(wc -l < resolved.txt) packages, none of them torch"
